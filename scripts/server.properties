# Local-only offline development server; never expose this configuration to the internet.
server-ip=127.0.0.1
server-port=25565
online-mode=false
enforce-secure-profile=false
view-distance=4
simulation-distance=4
max-players=10
motd=Meowo Local Development
spawn-protection=0
# Paper defaults this to true, and on 1.21.9+ Minecraft removed the feature, so every world in the
# server logs "Keep spawn in memory feature has been removed" once per start. False is the same
# behaviour with no reminder.
keep-spawn-in-memory=false
level-type=minecraft:flat
generate-structures=false
generator-settings={"layers":[{"height":1,"block":"minecraft:bedrock"},{"height":2,"block":"minecraft:dirt"},{"height":1,"block":"minecraft:grass_block"}],"biome":"minecraft:plains"}
