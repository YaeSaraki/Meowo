# The keys this context sends, as a test fixture.
#
# The real language bundles live in `core`, which depends on this module and so cannot be on its
# test classpath. MockBukkit therefore has nothing to read, and `Messages` — which falls back to the
# raw key — throws instead of answering. These two files are that minimum: enough for the routes to
# be refused with a sentence rather than with a stack trace.
