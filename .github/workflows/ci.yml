name: CI

# Every push and every pull request runs the same thing: the tests, the architecture gate and the
# coverage gate. The gates are part of `check` (see the root `build.gradle.kts`), so this workflow
# does not have to know their names — and a gate added later is enforced without anyone editing
# this file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Read-only: CI verifies, it does not publish. The release workflow is the one that writes.
  contents: read

jobs:
  verify:
    name: Test, architecture and coverage
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, not to a tag. A tag is a name that can be moved to a different commit
      # later, and whoever moves it decides what this workflow runs — that is not a decision a
      # release pipeline should leave to somebody else's push. The version is in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Two JDKs, because the build needs two of them.
      #
      # JDK 21 runs the Gradle daemon: `gradle/gradle-daemon-jvm.properties` asks for Java 21, and
      # Gradle 8.14 cannot run its daemon on Java 25 at all — it fails with a bare "25.0.2" when it
      # tries to read the version. So the daemon JVM is not a preference here, it is the only
      # version the daemon will start on.
      #
      # JDK 25 does the compiling and the testing: `jvmToolchain(25)` and the resolvable
      # configurations are stamped `TARGET_JVM_VERSION = 25`. The bytecode target is 21, so the
      # result still runs on a Java 21 server.
      #
      # `cache: gradle` is deliberately absent. `gradle/actions/setup-gradle` already manages the
      # Gradle User Home, and the two of them writing the same directory is the documented way to
      # end up with a cache nobody can reason about.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Remember where JDK 21 landed
        run: echo "JDK21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Remember where JDK 25 landed
        run: echo "JDK25=$JAVA_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Both JDKs have to be visible to Gradle, not just to the shell. The daemon looks for Java 21
      # and the toolchain looks for Java 25; `setup-java` puts them in separate directories and
      # Gradle does not look there on its own. The paths are recorded as they are installed rather
      # than read from the runner image, so the build does not depend on which JDKs the image
      # happens to ship.
      - name: Point Gradle at both JDKs
        run: ./gradlew --version -Dorg.gradle.java.installations.paths="$JDK21,$JDK25"

      - name: Build and verify
        run: ./gradlew check build --stacktrace -Dorg.gradle.java.installations.paths="$JDK21,$JDK25"

      # The jar of every build, downloadable from the run. A build that is only reachable as a
      # green tick cannot be tried on a real server, and "it works on my machine" is a sentence
      # that needs a jar to be true.
      #
      # Named after the commit rather than after the version: this build has no version yet — the
      # version belongs to the release tag — and a file called `Meowo-1.0.0.jar` that is not 1.0.0
      # is a lie about what was built.
      - name: Keep the jar as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Meowo-dev-${{ github.sha }}
          path: core/build/libs/Meowo-*.jar
          if-no-files-found: error
