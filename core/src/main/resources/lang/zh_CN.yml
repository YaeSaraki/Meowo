# Meowo 玩家消息 · 简体中文
#
# 约定：
#   § 开头为 Minecraft 传统颜色码，仅对玩家渲染；控制台/RCON/命令方块会自动去除。
#   纯文本（不含 §）同样可用，颜色只是修饰。
#   \n 换行会拆成多条聊天消息，Paper 原生支持。
#   占位符为 {0} {1}，按顺序替换；不使用 %s 或 String.format。
#   颜色语义：§a 成功 §c 错误 §e 数值/强调 §7 次要说明 §8 弱化 §b 品牌 §f 正文

# ═══════════ 发言者 ═══════════
# 玩家看到的聊天消息会带上发言者名字，渲染为「✉ 名字 内容」。
# 名字和正文都由我们拼好整行下发；**不要**改回 ChatType.CHAT.bind，
# 那会让客户端用 chat.type.text 把整行套进 < > 里，删不掉（docs/minimax/09 §2）。
# 命名规则为 <上下文>Cat；可在语言文件里改名，留空或删掉则回落到代码里的默认值。
# 注意：这是「系统消息」而非真实玩家发言，因此没有签名与真实档案，
# 不能私聊、@ 提及或删除，客户端可能显示「无法验证」指示条。详见 docs/minimax/09。
speaker-system: "MeowCat"
speaker-economy: "EconCat"
speaker-menu: "MenuCat"
speaker-render: "RendCat"
speaker-spawn: "WarpCat"
speaker-home: "NestCat"
speaker-sit: "SitCat"
speaker-hat: "HatCat"
speaker-nametag: "IdleCat"
speaker-mine: "MineCat"
speaker-shadowbox: "ShadCat"
speaker-teleport: "TeleCat"
speaker-invsee: "InvCat"
speaker-shop: "ShopCat"

