# Meowo player messages · English
#
# Conventions:
#   § prefixed codes are legacy Minecraft colours, rendered for players only; they are stripped
#   for console/RCON/command blocks. Plain text without § also works — colour is decoration.
#   \n breaks become separate chat lines (native Paper behaviour).
#   Placeholders are {0} {1} in positional order; %s / String.format is not used.
#   Colour meaning: §a success §c error §e value/emphasis §7 secondary §8 muted §b brand §f body

# ═══════════ SPEAKERS ═══════════
# Player-facing chat is attributed to a speaker and renders as "✉ Name content".
# The name and the body are composed and delivered together as one plain message. Do **not** go
# back to ChatType.CHAT.bind: the client then wraps the whole line in <> via chat.type.text, and
# that pair cannot be stripped server-side (docs/minimax/09 §2).
# Naming rule is <Context>Cat; rename freely here. Blank or removed falls back to the code default.
# These are system messages, not real player speech: no signature, no profile, so they cannot be
# whispered, mentioned or deleted. See docs/minimax/09.
speaker-system: "MeowCat"
speaker-economy: "EconCat"
speaker-menu: "MenuCat"
speaker-render: "RendCat"
speaker-spawn: "WarpCat"
speaker-home: "NestCat"
speaker-sit: "SitCat"
speaker-hat: "HatCat"
speaker-nametag: "IdleCat"
speaker-mine: "MineCat"
speaker-shadowbox: "ShadCat"
speaker-teleport: "TeleCat"
speaker-invsee: "InvCat"
speaker-shop: "ShopCat"

