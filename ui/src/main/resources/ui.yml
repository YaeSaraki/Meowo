# 每个界面都是数据：槽位、图标、文案、动作都在这里改。
#
# action 有两种写法：
#   "pomodoro start"   一条指令，以玩家身份执行（权限照常生效）
#   "@back"            内置动作，由 ui 模块自己实现
#
# 键名若写成语言包里的键（如 pomodoro-action-start），会自动取当前语言；
# 直接写文字则原样显示，支持 & 颜色码。
defaults:
  rows: 6

screens:
  # 番茄钟柱殿：七个功能柱 + 状态核心 + 底行导航
  pomodoro:
    title: pomodoro-main-title
    rows: 6
    rail:
      name: pomodoro-action-back
      lore: pomodoro-do-back
    plinth:
      name: pomodoro-action-main-menu
      lore: pomodoro-do-main-menu
    buttons:
      10: { icon: AMETHYST_CLUSTER, name: pomodoro-action-start, lore: [pomodoro-do-start], action: "pomodoro start" }
      11: { icon: REDSTONE_TORCH,  name: pomodoro-action-pause, lore: [pomodoro-do-pause], action: "pomodoro pause" }
      12: { icon: ARROW,           name: pomodoro-action-next,  lore: [pomodoro-do-next],  action: "pomodoro next" }
      13: { icon: BARRIER,         name: pomodoro-action-stop,  lore: [pomodoro-do-stop],  action: "pomodoro stop" }
      14: { icon: BOOK,            name: pomodoro-action-gallery, lore: [pomodoro-do-gallery], action: "pomodoro presets" }
      15: { icon: WRITABLE_BOOK,   name: pomodoro-action-create, lore: [pomodoro-do-create], action: "pomodoro create" }
      16: { icon: EXPERIENCE_BOTTLE, name: pomodoro-action-stats, lore: [pomodoro-do-stats], action: "pomodoro stats" }
      37: { icon: LIME_DYE,        name: pomodoro-toggle-bossbar-on, action: "pomodoro visuals bossbar" }
      38: { icon: LIME_DYE,        name: pomodoro-toggle-title-on,   action: "pomodoro visuals title" }
      39: { icon: KNOWLEDGE_BOOK,  name: pomodoro-action-help, lore: [pomodoro-do-help], action: "pomodoro help" }
      45: { icon: BEDROCK, name: pomodoro-action-main-menu, lore: [pomodoro-do-main-menu], action: "@main-menu" }
      53: { icon: BEDROCK, name: pomodoro-action-main-menu, lore: [pomodoro-do-main-menu], action: "@main-menu" }
      46: { icon: PURPLE_STAINED_GLASS_PANE, name: pomodoro-action-back, lore: [pomodoro-do-back], action: "@back" }

  # 预设长廊：动态列表。content-slots 决定元素放哪，翻页由 ui 负责。
  pomodoro-gallery:
    title: pomodoro-gallery-title
    rows: 6
    content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
    rail:
      name: pomodoro-action-back
      lore: pomodoro-do-back
    plinth:
      name: pomodoro-action-main-menu
      lore: pomodoro-do-main-menu
    buttons:
      49: { icon: EMERALD, name: pomodoro-action-create, lore: [pomodoro-do-create], action: "pomodoro create" }
      45: { icon: BEDROCK, name: pomodoro-action-main-menu, lore: [pomodoro-do-main-menu], action: "@main-menu" }
      53: { icon: BEDROCK, name: pomodoro-action-main-menu, lore: [pomodoro-do-main-menu], action: "@main-menu" }
      46: { icon: PURPLE_STAINED_GLASS_PANE, name: pomodoro-action-prev, lore: [pomodoro-do-prev], action: "@page-previous" }
      52: { icon: PURPLE_STAINED_GLASS_PANE, name: pomodoro-action-next-page, lore: [pomodoro-do-next-page], action: "@page-next" }

  # 预设编辑器：六个字段柱 + 预览 + 保存/复制/删除
  pomodoro-editor:
    title: pomodoro-editor-title
    rows: 6
    rail:
      name: pomodoro-action-back
      lore: pomodoro-do-discard
    plinth:
      name: pomodoro-action-main-menu
      lore: pomodoro-do-main-menu
    buttons:
      10: { icon: NAME_TAG,      name: pomodoro-editor-name,      lore: [pomodoro-editor-name-help],      action: "pomodoro editor name" }
      11: { icon: IRON_PICKAXE, name: pomodoro-preset-work, lore: [pomodoro-editor-adjust-hint], action: "pomodoro editor work up", action-right: "pomodoro editor work down" }
      12: { icon: APPLE, name: pomodoro-preset-break, lore: [pomodoro-editor-adjust-hint], action: "pomodoro editor break up", action-right: "pomodoro editor break down" }
      13: { icon: CAKE, name: pomodoro-preset-long-break, lore: [pomodoro-editor-adjust-hint], action: "pomodoro editor long-break up", action-right: "pomodoro editor long-break down" }
      14: { icon: CLOCK, name: pomodoro-preset-sessions, lore: [pomodoro-editor-adjust-hint], action: "pomodoro editor sessions up", action-right: "pomodoro editor sessions down" }
      15: { icon: PAINTING,      name: pomodoro-editor-icon,      lore: [pomodoro-editor-icon-help],      action: "pomodoro editor icon up", action-right: "pomodoro editor icon down" }
      16: { icon: MILK_BUCKET,   name: pomodoro-editor-reset,     lore: [pomodoro-do-reset],              action: "pomodoro editor reset" }
      37: { icon: LIME_WOOL,     name: pomodoro-editor-save,      action: "pomodoro editor save" }
      39: { icon: MAP,           name: pomodoro-editor-duplicate, lore: [pomodoro-do-duplicate], action: "pomodoro editor duplicate" }
      41: { icon: RED_WOOL,      name: pomodoro-editor-delete,    lore: [pomodoro-do-delete],    action: "pomodoro editor delete" }
      45: { icon: BEDROCK, name: pomodoro-action-main-menu, lore: [pomodoro-do-main-menu], action: "@main-menu" }
      53: { icon: BEDROCK, name: pomodoro-action-main-menu, lore: [pomodoro-do-main-menu], action: "@main-menu" }
      46: { icon: PURPLE_STAINED_GLASS_PANE, name: pomodoro-action-back, lore: [pomodoro-do-discard], action: "@back" }

  # 通用确认页：标题与详情由调用方传，两个柱子的动作是 @yes / @no 之外的指令
  confirm:
    title: pomodoro-confirm-delete-title
    rows: 6
    rail:
      name: pomodoro-action-back
      lore: pomodoro-do-back
    plinth:
      name: pomodoro-action-main-menu
      lore: pomodoro-do-main-menu
    buttons:
      11: { icon: RED_WOOL,  name: pomodoro-confirm-no,  action: "@cancel" }
      15: { icon: LIME_WOOL, name: pomodoro-confirm-yes, action: "@confirm" }
      45: { icon: BEDROCK, name: pomodoro-action-main-menu, lore: [pomodoro-do-main-menu], action: "@main-menu" }
      53: { icon: BEDROCK, name: pomodoro-action-main-menu, lore: [pomodoro-do-main-menu], action: "@main-menu" }
      46: { icon: PURPLE_STAINED_GLASS_PANE, name: pomodoro-action-back, lore: [pomodoro-do-back], action: "@back" }

  # 总菜单：心形。
  #
  # 布局按「心形」house style 画成一颗左右对称的心，四个内容行正好放得下：
  #   11 12 · 14 15   两瓣的上沿（中间 13 是心形的凹口）
  #   19 … 25         最宽的一行
  #   29 … 33         往里收一格
  #   39 40 41        心尖
  #
  # 左右对称是绕第 4 列（槽位 13 / 22 / 31 / 40）镜像的，所以一格的位置就是
  # `9 × 行 + 列`，镜像格是 `9 × 行 + (8 − 列)`。
  # 轮廓是紫水晶块（纯装饰），心里面是功能按钮，轴线上（22 / 31）是小晶簇与核心。
  # 左右两对功能格互为镜像：20 与 24 是一对，21 与 23 是一对，30 与 32 是一对。
  # **改任何一格都必须连它的镜像格一起改**，否则心会立刻看起来是歪的。
  #
  # 这个界面画的是心形，不是柱殿：柱身会从两瓣上沿往下拉，把心切成两半。
  # 所以这里关掉 pillars —— 柱殿是默认样式，要退出它得明说。
  #
  # 底栏沿用全插件统一的导航轨（45/53 基座、46…52 玻璃），这里只补中间的主操作格 49。
  menu:
    title: menu-main-title
    rows: 6
    pillars: false
    rail:
      name: menu-item-back-main
      lore: menu-item-back-main-lore
    plinth:
      name: menu-item-main-menu
      lore: menu-item-main-menu-lore
    buttons:
      # ── 心形轮廓：装饰，不响应点击 ──
      11: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      12: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      14: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      15: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      19: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      25: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      29: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      33: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      39: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      40: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      41: { icon: AMETHYST_BLOCK, name: menu-item-heart, lore: [menu-item-heart-lore], action: "@none" }
      # ── 心里的功能格 ──
      20: { icon: WHITE_BED,        name: menu-item-homes,    lore: [menu-item-homes-lore],    action: "homes" }
      21: { icon: AMETHYST_CLUSTER, name: menu-item-pomodoro, lore: [menu-item-pomodoro-lore], action: "pomodoro gui" }
      22: { icon: AMETHYST_SHARD,   name: menu-item-heart,    lore: [menu-item-heart-lore],    action: "@none" }
      23: { icon: IRON_INGOT,       name: menu-item-shop,     lore: [menu-item-shop-lore],     action: "sell gui" }
      24: { icon: GOLD_NUGGET,      name: menu-item-wallet,   lore: [menu-item-wallet-lore],   action: "eco balance" }
      # 幻翼与体型分列核心两侧；名字与当前状态由 menu 模块在打开时覆盖。
      # 这两格走的是**完整路由**（`meowo phantom` / `meowo size up`），不是根命令：
      # `size` 这种通用词别的插件也可能占着，而菜单格子静悄悄执行到别人的命令
      # 比不执行更难查。根命令 `/phantom` `/size` 仍然留给玩家手打。
      30: { icon: PHANTOM_MEMBRANE, name: menu-item-phantom, lore: [menu-item-phantom-hint], action: "meowo phantom", permission: meowo.phantom }
      31: { icon: BUDDING_AMETHYST, name: menu-item-core,   lore: [menu-item-core-lore],   action: "@none", glint: true }
      32: { icon: SLIME_BLOCK,      name: menu-item-size,   lore: [menu-item-size-hint],   action: "meowo size up", action-right: "meowo size down", action-shift: "meowo size reset", permission: meowo.size }
      # ── 底栏主操作 ──
      49: { icon: BARRIER, name: menu-item-close, lore: [menu-item-close-lore], action: "@close" }

  # 喵达 ModaCat 商店：价目表。矿石格子由 shop 模块提供（每种一格，左键卖该种全部、
  # 右键卖主手），这里只负责外框、底栏和翻页位置。
  shop:
    title: shop-title
    rows: 6
    content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
    rail:
      name: menu-item-back-main
      lore: menu-item-back-main-lore
    plinth:
      name: menu-item-main-menu
      lore: menu-item-main-menu-lore
    buttons:
      45: { icon: BEDROCK, name: menu-item-main-menu, lore: [menu-item-main-menu-lore], action: "@main-menu" }
      53: { icon: BEDROCK, name: menu-item-main-menu, lore: [menu-item-main-menu-lore], action: "@main-menu" }
      46: { icon: PURPLE_STAINED_GLASS_PANE, name: menu-item-back-main, lore: [menu-item-back-main-lore], action: "@back" }
      48: { icon: PAPER, name: shop-sell-all, lore: [shop-sell-all-lore], action: "sell" }
      49: { icon: HOPPER, name: shop-hand, lore: [shop-hand-lore], action: "sell hand" }
      50: { icon: OAK_DOOR, name: menu-item-back-main, lore: [menu-item-back-main-lore], action: "@main-menu" }

  # 家园总览：动态列表。玻璃＝上一页（列表语义），基岩＝回总菜单
  menu-homes:
    title: menu-homes-title
    rows: 6
    content-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
    rail:
      name: menu-item-back-main
      lore: menu-item-back-main-lore
    plinth:
      name: menu-item-main-menu
      lore: menu-item-main-menu-lore
    buttons:
      45: { icon: BEDROCK, name: menu-item-main-menu, lore: [menu-item-main-menu-lore], action: "@main-menu" }
      53: { icon: BEDROCK, name: menu-item-main-menu, lore: [menu-item-main-menu-lore], action: "@main-menu" }
      46: { icon: PURPLE_STAINED_GLASS_PANE, name: menu-item-page-prev, action: "@page-previous" }
      52: { icon: PURPLE_STAINED_GLASS_PANE, name: menu-item-page-next, action: "@page-next" }
      48: { icon: COMPASS, name: menu-item-nav-off, action: "meowo home nav off" }
      49: { icon: PAPER, name: menu-homes-summary, action: "@none" }
      50: { icon: OAK_DOOR, name: menu-item-back-main, lore: [menu-item-back-main-lore], action: "@main-menu" }

  # 家园详情。坐标、距离、颜色、当前可见性这类数据由模块用 values/overrides 提供；
  # 指令里 {slot} 是"当前展示的这个家园的编号"，打开时由模块传入。
  home-edit:
    title: home-edit-title
    rows: 6
    rail:
      name: home-back
      lore: menu-item-back-up-lore
    plinth:
      name: menu-item-main-menu
      lore: menu-item-main-menu-lore
    buttons:
      4:  { icon: WHITE_BED, name: home-menu-icon, action: "@none" }
      9:  { icon: NETHER_STAR, name: home-force-travel, lore: [home-force-help], action: "home {slot} force" }
      10: { icon: ENDER_PEARL, name: home-travel, action: "home {slot}" }
      11: { icon: NAME_TAG, name: home-rename, lore: [home-free], action: "home gui rename {slot}" }
      12: { icon: PAINTING, name: home-color, lore: [home-free], action: "home gui color {slot}" }
      13: { icon: COMPASS, name: home-visible, lore: [home-free], action: "home gui show {slot} {show}" }
      14: { icon: PAPER, name: home-bar-icon, lore: [home-icon-detail, home-icon-limit], action: "home gui icons {slot} bar" }
      15: { icon: WHITE_BED, name: home-menu-icon, lore: [home-free], action: "home gui icons {slot} menu" }
      16: { icon: RECOVERY_COMPASS, name: home-nav-select, action: "home gui nav {slot}" }
      20: { icon: LODESTONE, name: home-relocate, lore: [home-set-tax-hint], action: "home gui set {slot}" }
      24: { icon: LAVA_BUCKET, name: home-delete, lore: [home-free], action: "home gui delete {slot}" }

  # 颜色页：16 色是数据，所以走列表；每格的动作由模块写成具体指令（含颜色名）。
  home-color:
    title: home-color
    rows: 6
    content-slots: [10,11,12,13,14,15,16,17,19,20,21,22,23,24,25,26]
    rail:
      name: home-back
      lore: menu-item-back-up-lore
    plinth:
      name: menu-item-main-menu
      lore: menu-item-main-menu-lore

  # 界面栏图标：两种样式
  home-icon-bar:
    title: home-bar-icon
    rows: 6
    rail:
      name: home-back
      lore: menu-item-back-up-lore
    plinth:
      name: menu-item-main-menu
      lore: menu-item-main-menu-lore
    buttons:
      11: { icon: SNOWBALL, name: home-style-default, lore: [home-icon-limit], action: "home gui icon {slot} default" }
      15: { icon: STRING, name: home-style-bowtie, lore: [home-icon-limit], action: "home gui icon {slot} bowtie" }

  # 菜单图标：16 种材质，是数据
  home-icon-menu:
    title: home-menu-icon
    rows: 6
    content-slots: [10,11,12,13,14,15,16,17,19,20,21,22,23,24,25,26]
    rail:
      name: home-back
      lore: menu-item-back-up-lore
    plinth:
      name: menu-item-main-menu
      lore: menu-item-main-menu-lore

  # 通用确认页：金额与名称由模块覆盖，是格只发指令
  home-confirm:
    title: home-confirm-title
    rows: 6
    rail:
      name: home-back
      lore: menu-item-back-up-lore
    plinth:
      name: menu-item-main-menu
      lore: menu-item-main-menu-lore
    buttons:
      4:  { icon: WHITE_BED, name: home-menu-icon, action: "@none" }
      11: { icon: LIME_CONCRETE, name: home-confirm, action: "home gui confirm" }
      15: { icon: RED_CONCRETE, name: home-back, action: "@back" }
